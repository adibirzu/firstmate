# Orca worktree lifecycle for firstmate. Local-only helpers: no network, no secrets.
# Guards keep older worktrees (without the helpers) from failing setup or archive.
scripts:
  setup: "if [ -f bin/fm-orca-worktree-setup.sh ]; then bash bin/fm-orca-worktree-setup.sh; fi"
  archive: "if [ -f bin/fm-orca-worktree-archive.sh ]; then bash bin/fm-orca-worktree-archive.sh; fi"
setupAgentStartupPolicy: wait-for-setup
