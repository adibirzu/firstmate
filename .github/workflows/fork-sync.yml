name: Fork sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main into fork main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -eu
          git remote add upstream https://github.com/kunchenguid/firstmate.git
          git fetch upstream main
          git fetch origin main
          git checkout -B main origin/main

      - name: Merge upstream
        id: merge
        continue-on-error: true
        run: |
          set -eu
          git merge --no-edit upstream/main

      - name: Install pinned ShellCheck
        if: steps.merge.outcome == 'success'
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install tasks-axi
        if: steps.merge.outcome == 'success'
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version

      - name: Validate merged tree
        if: steps.merge.outcome == 'success'
        env:
          GITHUB_ACTIONS: "false"
          CI: "false"
        run: |
          set -eu
          bin/fm-lint.sh
          bin/fm-test-run.sh --changed --base HEAD^

      - name: Push clean sync
        if: steps.merge.outcome == 'success'
        run: |
          set -eu
          if git diff --quiet origin/main..HEAD; then
            echo "Fork main already contains upstream main."
            exit 0
          fi
          git push origin HEAD:main

      - name: Open or refresh conflict PR
        if: steps.merge.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          git merge --abort || true
          if git ls-remote --exit-code --heads origin sync/upstream >/dev/null 2>&1; then
            git fetch origin sync/upstream
            git checkout -B sync/upstream origin/sync/upstream
            if ! git merge --no-edit upstream/main; then
              echo "::error::Existing sync/upstream branch also conflicts with upstream/main; manual refresh required."
              exit 1
            fi
          else
            git checkout -B sync/upstream upstream/main
          fi
          git push origin HEAD:sync/upstream
          pr_url=$(gh pr list --head sync/upstream --base main --state open --json url --jq '.[0].url // empty')
          body_file="$RUNNER_TEMP/fork-sync-pr.md"
          cat > "$body_file" <<'EOF'
Automated upstream sync could not merge cleanly into fork `main`.

This branch tracks upstream `kunchenguid/firstmate:main` so the conflict can be resolved in a normal pull request.
EOF
          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" --title "sync: upstream main" --body-file "$body_file"
            echo "Updated $pr_url"
          else
            gh pr create --base main --head sync/upstream --title "sync: upstream main" --body-file "$body_file"
          fi
